name: Android 1.35 emulator smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-emulator-ui-qa.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulator-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve APK compiled on Windows with ephemeral test key
        uses: actions/download-artifact@v4
        with:
          name: rotorcalculator-1.35-temp-signed-qa-apk
          run-id: 40603802051
          github-token: ${{ github.token }}
          path: scratch/native-qa
      - name: Confirm candidate APK exists
        run: |
          find scratch/native-qa -type f -maxdepth 6 -print
          find scratch/native-qa -type f -name '*.apk' | grep -q .
      - name: Enable KVM hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch emulator and exercise native output-unit selector
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          script: |
            python3 tools/android_emulator_smoke.py "$(find scratch/native-qa -type f -name '*.apk' -print -quit)"
      - name: Save real Android screenshots and accessibility trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotorcalculator-1.35-android-emulator-qa
          path: scratch/screenshots/
          if-no-files-found: ignore
          retention-days: 7
