name: Frontend Source QA

on:
  pull_request:
    branches:
      - main

concurrency:
  group: rotor-frontend-source-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "Experimental branch retired; main is authoritative."
