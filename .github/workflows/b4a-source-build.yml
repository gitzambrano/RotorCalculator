name: B4A Source Build Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-b4a:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install B4A 14
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://www.b4x.com/android/files/B4A.exe" -OutFile "$env:RUNNER_TEMP\B4A.exe"
          Start-Process "$env:RUNNER_TEMP\B4A.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $candidates = @(
            "C:\Program Files\Anywhere Software\B4A\B4ABuilder.exe",
            "C:\Program Files\Anywhere Software\Basic4android\B4ABuilder.exe",
            "C:\Program Files (x86)\Anywhere Software\Basic4android\B4ABuilder.exe"
          )
          $builder = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builder) { throw "B4ABuilder.exe not found after install" }
          "B4A_BUILDER=$builder" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $builder 2>&1 | Select-Object -First 20

      - name: Install B4X OpenJDK 19
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://www.b4x.com/b4j/files/jdk-19.0.2.zip" -OutFile "$env:RUNNER_TEMP\jdk.zip"
          New-Item -ItemType Directory -Force -Path "C:\java" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\jdk.zip" -DestinationPath "C:\java" -Force
          $javac = Get-ChildItem "C:\java" -Filter javac.exe -Recurse | Select-Object -First 1
          if (-not $javac) { throw "javac.exe not found" }
          $javaBin = $javac.Directory.FullName
          "JAVA_BIN=$javaBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "JavaBin=$javaBin"

      - name: Install B4A Android SDK resources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/AnywhereSoftware/B4A/releases/download/7_25/resources_7_25.zip" -OutFile "$env:RUNNER_TEMP\android-resources.zip"
          New-Item -ItemType Directory -Force -Path "C:\Android" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\android-resources.zip" -DestinationPath "C:\Android" -Force
          $androidJar = Get-ChildItem "C:\Android" -Filter android.jar -Recurse | Where-Object { $_.FullName -match "android-36" } | Select-Object -First 1
          if (-not $androidJar) {
            $androidJar = Get-ChildItem "C:\Android" -Filter android.jar -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $androidJar) { throw "android.jar not found in B4A resources" }
          $platform = $androidJar.Directory.FullName
          "PLATFORM_FOLDER=$platform" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "PlatformFolder=$platform"

      - name: Configure B4A and compile source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $iniDir = Join-Path $env:APPDATA "Anywhere Software\Basic4android"
          New-Item -ItemType Directory -Force -Path $iniDir | Out-Null
          $ini = Join-Path $iniDir "b4xV5.ini"
          @"
          ; generated by RotorCalculator CI
          AdditionalLibrariesFolder=$env:GITHUB_WORKSPACE\Libraries
          JavaBin=$env:JAVA_BIN
          PlatformFolder=$env:PLATFORM_FOLDER
          SharedModulesFolder=
          SignKeyFile=
          SignKeyPassword=
          SignKeyAlias=
          MaxRamForDex=2048
          ProcessesTimeoutSeconds=120
          "@ | Set-Content -Path $ini -Encoding UTF8

          Push-Location $env:GITHUB_WORKSPACE
          try {
            & $env:B4A_BUILDER "-Task=Build" "-NoSign=True" "-ShowWarnings=True" "-BaseFolder=$env:GITHUB_WORKSPACE" "-INI=$ini"
            if ($LASTEXITCODE -ne 0) { throw "B4A builder failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          Get-ChildItem $env:GITHUB_WORKSPACE -Filter *.apk -Recurse | ForEach-Object { Write-Host $_.FullName }
          $apk = Get-ChildItem $env:GITHUB_WORKSPACE -Filter *.apk -Recurse |
            Where-Object { $_.FullName -match "\\Objects\\" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $apk) { throw "No newly built APK found" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-build" | Out-Null
          Copy-Item $apk.FullName "$env:GITHUB_WORKSPACE\ci-build\RotorCalculator-ci.apk" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RotorCalculator-b4a-build
          path: ci-build/RotorCalculator-ci.apk
          if-no-files-found: error
          retention-days: 7
