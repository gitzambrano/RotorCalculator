name: Frontend Source QA

# Lightweight mechanical checks only. Emulator UI QA, B4A compilation and
# visual verification run offline (AGENTS.md section 5, Gates 1 and 2).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "RotorCalculator.b4a"
      - "RotorPopups.bas"
      - "RotorStorage.bas"
      - "RotorNames.bas"
      - "zBETEngine.bas"
      - "clsSheet.bas"
      - "web/**"
      - "tests/**"
      - "tools/zBET.py"
      - "tools/verify_engine.py"
      - ".github/workflows/frontend-source-qa.yml"

concurrency:
  group: rotor-frontend-source-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-qa:
    name: engine-and-source-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas matplotlib pytest
      - name: Verify engine reference and source contract
        run: python tools/verify_engine.py
      - name: Static and engine tests
        run: python -m pytest -q tests

  web-qa:
    name: web-typecheck-and-unit-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
