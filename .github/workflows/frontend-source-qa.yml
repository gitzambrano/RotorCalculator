name: Frontend Source QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rotor-frontend-source-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cleanup-stale-qa:
    name: cancel-stale-experimental-qa
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale experimental workflow runs
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling stale ui/frontend-5-star workflow runs..."
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=ui/frontend-5-star&per_page=100"             --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending") | .id'           | while read -r id; do
              [ -z "$id" ] && continue
              echo "Cancel run $id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
            done

  build-b4a:
    name: build-b4a-source
    needs: cleanup-stale-qa
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install B4A 14
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://www.b4x.com/android/files/B4A.exe" -OutFile "$env:RUNNER_TEMP\B4A.exe"
          Start-Process "$env:RUNNER_TEMP\B4A.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          $candidates = @(
            "C:\Program Files\Anywhere Software\B4A\B4ABuilder.exe",
            "C:\Program Files\Anywhere Software\Basic4android\B4ABuilder.exe",
            "C:\Program Files (x86)\Anywhere Software\Basic4android\B4ABuilder.exe"
          )
          $builder = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $builder) { throw "B4ABuilder.exe not found after install" }
          "B4A_BUILDER=$builder" | Out-File -FilePath $env:GITHUB_ENV -Append
          $nativeLibs = Join-Path (Split-Path -Parent $builder) "Libraries"
          New-Item -ItemType Directory -Force -Path $nativeLibs | Out-Null
          "B4A_NATIVE_LIBS=$nativeLibs" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "B4A builder: $builder"
          Write-Host "B4A native libraries: $nativeLibs"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '19'

      - name: Configure Java path for B4A
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $javac = Get-Command javac -ErrorAction Stop
          $javaBin = Split-Path -Parent $javac.Source
          "JAVA_BIN=$javaBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "JavaBin=$javaBin"

      - name: Restore B4A Android SDK resources
        id: b4a-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Android
          key: b4a-android-resources-7-25-v1

      - name: Install B4A Android SDK resources
        if: steps.b4a-sdk-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/AnywhereSoftware/B4A/releases/download/7_25/resources_7_25.zip" -OutFile "$env:RUNNER_TEMP\android-resources.zip"
          New-Item -ItemType Directory -Force -Path "C:\Android" | Out-Null
          & 7z x "$env:RUNNER_TEMP\android-resources.zip" "-oC:\Android" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed extracting Android resources" }

      - name: Resolve B4A Android platform
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $androidJar = Get-ChildItem "C:\Android" -Filter android.jar -Recurse |
            Where-Object { $_.FullName -match "android-36" } | Select-Object -First 1
          if (-not $androidJar) {
            $androidJar = Get-ChildItem "C:\Android" -Filter android.jar -Recurse |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $androidJar) { throw "android.jar not found in B4A resources" }
          "PLATFORM_FOLDER=$($androidJar.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

          $toolsFolder = "C:\Android\tools"
          if (-not (Test-Path $toolsFolder)) {
            $sdkManager = Get-ChildItem "C:\Android" -Filter sdkmanager.bat -Recurse | Select-Object -First 1
            if ($sdkManager) {
              $toolsFolder = Split-Path -Parent (Split-Path -Parent $sdkManager.FullName)
            }
          }
          if (-not (Test-Path $toolsFolder)) { throw "Android tools folder not found" }
          "TOOLS_FOLDER=$toolsFolder" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "PlatformFolder=$($androidJar.Directory.FullName)"
          Write-Host "ToolsFolder=$toolsFolder"

      - name: Save B4A Android SDK resources cache
        if: steps.b4a-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Android
          key: b4a-android-resources-7-25-v1

      - name: Configure B4A and compile source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Stage only the external library still referenced by RotorCalculator.
          $addRoot = Join-Path $env:RUNNER_TEMP "B4X-Additional"
          $addB4A = Join-Path $addRoot "B4A"
          New-Item -ItemType Directory -Force -Path $addB4A | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\Libraries\RSPopupMenu.*" $addB4A -Force
          Copy-Item "$env:GITHUB_WORKSPACE\Libraries\RSPopupMenu.*" $env:B4A_NATIVE_LIBS -Force

          # Use B4A's own INI defaults when present, then override only path settings.
          $iniCandidates = @(
            (Join-Path $env:APPDATA "Anywhere Software\Basic4android\b4xV5.ini"),
            (Join-Path $env:APPDATA "Anywhere Software\b4xV5.ini"),
            (Join-Path (Split-Path -Parent $env:B4A_BUILDER) "b4xV5.ini")
          )
          $sourceIni = $iniCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $ini = Join-Path $env:RUNNER_TEMP "RotorCalculator-b4xV5.ini"
          if ($sourceIni) {
            Copy-Item $sourceIni $ini -Force
            Write-Host "Base INI: $sourceIni"
          } else {
            New-Item -ItemType File -Force -Path $ini | Out-Null
            Write-Host "No default INI found; creating complete build INI."
          }

          function Set-IniValue([string]$Path,[string]$Key,[string]$Value) {
            $text = ""
            if (Test-Path $Path) { $text = Get-Content $Path -Raw }
            $pattern = "(?m)^" + [regex]::Escape($Key) + "=.*$"
            $line = $Key + "=" + $Value
            if ($text -match $pattern) {
              $text = [regex]::Replace($text,$pattern,[System.Text.RegularExpressions.MatchEvaluator]{ param($m) $line })
            } else {
              if ($text.Length -gt 0 -and -not $text.EndsWith([Environment]::NewLine)) { $text += [Environment]::NewLine }
              $text += $line + [Environment]::NewLine
            }
            [IO.File]::WriteAllText($Path,$text,[Text.Encoding]::UTF8)
          }

          Set-IniValue $ini "AdditionalLibrariesFolder" $addRoot
          Set-IniValue $ini "JavaBin" $env:JAVA_BIN
          Set-IniValue $ini "PlatformFolder" $env:PLATFORM_FOLDER
          Set-IniValue $ini "ToolsFolder" $env:TOOLS_FOLDER
          Set-IniValue $ini "SharedModulesFolder" ""
          Set-IniValue $ini "MaxRamForDex" "2048"
          Set-IniValue $ini "ProcessesTimeoutSeconds" "180"

          Write-Host "Effective B4A build paths:"
          Select-String -Path $ini -Pattern "^(JavaBin|PlatformFolder|ToolsFolder|AdditionalLibrariesFolder)=" | ForEach-Object { Write-Host $_.Line }

          Push-Location $env:GITHUB_WORKSPACE
          try {
            & $env:B4A_BUILDER "-Task=Build" "-NoSign=True" "-ShowWarnings=True" "-BaseFolder=$env:GITHUB_WORKSPACE" "-Project=RotorCalculator.b4a" "-INI=$ini"
            if ($LASTEXITCODE -ne 0) { throw "B4A builder failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          $apk = Get-ChildItem "$env:GITHUB_WORKSPACE\Objects" -Filter *.apk -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { throw "No APK produced by B4A" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-build" | Out-Null
          Copy-Item $apk.FullName "$env:GITHUB_WORKSPACE\ci-build\RotorCalculator-ci.apk" -Force
          Write-Host "Built APK: $($apk.FullName) ($($apk.Length) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: RotorCalculator-b4a-build
          path: ci-build/RotorCalculator-ci.apk
          if-no-files-found: error
          retention-days: 7

  ui-qa:
    name: real-apk-all-screens
    needs: build-b4a
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: RotorCalculator-b4a-build
          path: ci-apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare QA helpers
        shell: bash
        run: |
          mkdir -p qa-results
          cat > /tmp/ui_node.py <<'PY'
          import subprocess, sys, xml.etree.ElementTree as ET, re, json
          out = sys.argv[1]
          subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"], check=False, stdout=subprocess.DEVNULL)
          subprocess.run(["adb","pull","/sdcard/window.xml",out], check=True, stdout=subprocess.DEVNULL)
          root = ET.parse(out).getroot()
          def bounds(s):
              m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",s or "")
              return tuple(map(int,m.groups())) if m else None
          nodes=[]
          for n in root.iter("node"):
              text=(n.attrib.get("text") or "").strip()
              desc=(n.attrib.get("content-desc") or "").strip()
              if text or desc:
                  nodes.append({
                    "text":text, "desc":desc, "bounds":bounds(n.attrib.get("bounds")),
                    "clickable":n.attrib.get("clickable"), "enabled":n.attrib.get("enabled")
                  })
          print(json.dumps(nodes,ensure_ascii=False,indent=2))
          PY

          cat > /tmp/tap_text.py <<'PY'
          import subprocess, sys, xml.etree.ElementTree as ET, re, tempfile
          needle=sys.argv[1].lower()
          xml=tempfile.NamedTemporaryFile(delete=False,suffix=".xml").name
          subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"], check=False, stdout=subprocess.DEVNULL)
          subprocess.run(["adb","pull","/sdcard/window.xml",xml], check=True, stdout=subprocess.DEVNULL)
          root=ET.parse(xml).getroot()
          for n in root.iter("node"):
              hay=((n.attrib.get("text") or "")+" "+(n.attrib.get("content-desc") or "")).lower()
              if needle in hay:
                  m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib.get("bounds",""))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups())
                      if x2>x1 and y2>y1:
                          subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)
                          sys.exit(0)
          print("NOT_FOUND",sys.argv[1]); sys.exit(2)
          PY

          cat > /tmp/check_bounds.py <<'PY'
          import sys, json, glob, os
          w,h=map(int,sys.argv[1].split("x"))
          issues=[]
          for jf in glob.glob(os.path.join(sys.argv[2],"*.json")):
              for n in json.load(open(jf,encoding="utf-8")):
                  b=n.get("bounds")
                  if not b: continue
                  x1,y1,x2,y2=b
                  if x1<0 or y1<0 or x2>w or y2>h or x2<=x1 or y2<=y1:
                      issues.append({"file":os.path.basename(jf),"text":n.get("text"),"bounds":b})
          json.dump(issues,open(os.path.join(sys.argv[2],"bounds-issues.json"),"w"),ensure_ascii=False,indent=2)
          print("bounds issues:",len(issues))
          if issues:
              print(json.dumps(issues[:30],ensure_ascii=False))
              sys.exit(1)
          PY

      - name: Run freshly built APK through target screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            QA_APK="ci-apk/RotorCalculator-qa.apk"
            KEYSTORE="$RUNNER_TEMP/rotorcalculator-qa.jks"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android -alias qa -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RotorCalculator QA" >/dev/null 2>&1
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out "$QA_APK" ci-apk/RotorCalculator-ci.apk
            "$APKSIGNER" verify "$QA_APK"
            adb install -r "$QA_APK"

            capture_screen() {
              NAME="$1"; SIZE="$2"; ROT="$3"; FONT="$4"
              OUT="qa-results/$NAME"; mkdir -p "$OUT"
              W="${SIZE%x*}"; H="${SIZE#*x}"

              adb shell wm size "$SIZE"
              adb shell wm density 160
              adb shell settings put system font_scale "$FONT"
              adb shell settings put system accelerometer_rotation 0
              adb shell settings put system user_rotation "$ROT"
              adb shell am force-stop flightdyn.rotorcalculator
              adb shell monkey -p flightdyn.rotorcalculator -c android.intent.category.LAUNCHER 1 >/dev/null
              sleep 2
              adb shell pidof flightdyn.rotorcalculator > "$OUT/pid.txt"
              test -s "$OUT/pid.txt"

              adb exec-out screencap -p > "$OUT/01-geometry-top.png"
              python /tmp/ui_node.py "$OUT/01-geometry-top.xml" > "$OUT/01-geometry-top.json"

              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/3)) 300 || true
              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/3)) 300 || true
              adb exec-out screencap -p > "$OUT/02-geometry-bottom.png"
              python /tmp/ui_node.py "$OUT/02-geometry-bottom.xml" > "$OUT/02-geometry-bottom.json"

              python /tmp/tap_text.py CONDITIONS
              sleep 1
              adb exec-out screencap -p > "$OUT/03-conditions-top.png"
              python /tmp/ui_node.py "$OUT/03-conditions-top.xml" > "$OUT/03-conditions-top.json"

              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/3)) 300 || true
              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/3)) 300 || true
              adb exec-out screencap -p > "$OUT/04-conditions-bottom.png"
              python /tmp/ui_node.py "$OUT/04-conditions-bottom.xml" > "$OUT/04-conditions-bottom.json"

              python /tmp/tap_text.py RESULTS
              sleep 1
              adb exec-out screencap -p > "$OUT/05-results-top.png"
              python /tmp/ui_node.py "$OUT/05-results-top.xml" > "$OUT/05-results-top.json"

              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/4)) 300 || true
              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/4)) 300 || true
              adb exec-out screencap -p > "$OUT/06-results-mid.png"
              python /tmp/ui_node.py "$OUT/06-results-mid.xml" > "$OUT/06-results-mid.json"

              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/4)) 300 || true
              adb shell input swipe $((W/2)) $((H*4/5)) $((W/2)) $((H/4)) 300 || true
              adb exec-out screencap -p > "$OUT/07-results-bottom.png"
              python /tmp/ui_node.py "$OUT/07-results-bottom.xml" > "$OUT/07-results-bottom.json"

              adb shell input swipe $((W/2)) $((H/4)) $((W/2)) $((H*9/10)) 250 || true
              adb shell input swipe $((W/2)) $((H/4)) $((W/2)) $((H*9/10)) 250 || true
              adb shell input swipe $((W/2)) $((H/4)) $((W/2)) $((H*9/10)) 250 || true
              python /tmp/tap_text.py "OPEN MULTI-PARAMETER"
              sleep 1
              adb exec-out screencap -p > "$OUT/08-sweep.png"
              python /tmp/ui_node.py "$OUT/08-sweep.xml" > "$OUT/08-sweep.json"

              python /tmp/check_bounds.py "$SIZE" "$OUT"
              adb shell am force-stop flightdyn.rotorcalculator
            }

            capture_screen compact-320x568 320x568 0 1.0
            capture_screen compact-font130-320x568 320x568 0 1.3
            capture_screen standard-360x780 360x780 0 1.0
            capture_screen modern-393x873 393x873 0 1.0
            capture_screen large-412x915 412x915 0 1.0
            capture_screen tablet-small-600x960 600x960 0 1.0
            capture_screen tablet-768x1024 768x1024 0 1.0
            capture_screen landscape-phone-915x412 915x412 1 1.0
            capture_screen landscape-tablet-1024x600 1024x600 1 1.0

            adb shell settings put system font_scale 1.0
            adb shell wm size reset
            adb shell wm density reset

      - name: Upload screenshots and UI hierarchy
        uses: actions/upload-artifact@v4
        with:
          name: frontend-source-ui-qa
          path: qa-results
          if-no-files-found: error
          retention-days: 7
