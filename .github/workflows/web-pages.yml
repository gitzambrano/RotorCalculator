name: Web Pages

# Publish web/dist as the GitHub Pages site root.

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  cleanup-obsolete-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete temporary release branch created in error
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/release/1.34-prep-20261027"

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python QA dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install --disable-pip-version-check numpy pandas matplotlib pytest
      - name: Run Python and static source QA
        working-directory: ${{ github.workspace }}
        run: |
          python tools/verify_engine.py
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      # Keep the compiled web bundle on main alongside the source. The
      # workflow uses the exact checked-out source and ignores unrelated files.
      - name: Commit compiled web bundle to main
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if ! git diff --cached --quiet; then
            git commit -m "build(web): sync compiled GitHub Pages bundle [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
